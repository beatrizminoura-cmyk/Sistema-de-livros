<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meus Livros{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% if mensagens %}
            <div class="flash-messages" aria-live="polite" aria-atomic="true">
                {% for categoria, mensagem in mensagens %}
                    <div class="alert {{ categoria }}" role="status">
                        <span class="alert-icon" aria-hidden="true">
                            {% if categoria == 'success' %}✓{% else %}ℹ{% endif %}
                        </span>
                        <span class="alert-text">{{ mensagem }}</span>
                        <button class="alert-close" type="button" aria-label="Fechar aviso">&times;</button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

    <script>
        document.querySelectorAll('.alert').forEach((alerta) => {
            const fechar = () => {
                alerta.classList.add('alert-hide');
                setTimeout(() => alerta.remove(), 300);
            };
            const botao = alerta.querySelector('.alert-close');
            if (botao) botao.addEventListener('click', fechar);
            setTimeout(fechar, 4000);
        });
    </script>
</body>
</html>
