{% extends 'base.html' %}{% block title %}Cadastro | Meus Livros{% endblock %}{% block content %}<main class="login-container"><section class="login-card"><h1>Criar conta</h1><p>Monte sua estante de leitura.</p><form method="POST" class="book-form"><div class="form-group"><label>Nome</label><input name="nome" maxlength="100" required></div><div class="form-group"><label>E-mail</label><input type="email" name="email" required></div><div class="form-group"><label>Senha (mínimo 6 caracteres)</label><input type="password" name="senha" minlength="6" required></div><button class="btn-submit">Cadastrar</button></form><p><a href="{{ url_for('auth.login') }}">Voltar ao login</a></p></section></main>{% endblock %}
