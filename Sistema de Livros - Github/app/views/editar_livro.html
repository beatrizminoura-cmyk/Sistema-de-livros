
{% extends 'base.html' %}

{% block title %}Editar livro - Meus Livros{% endblock %}

{% block content %}

<div class="container">

    <header class="app-header">
        <div class="user-greeting">
            <span class="header-icon">▤</span>
            <div>
                <h1>Editar livro</h1>
                <p class="header-subtitle">Atualize sua estante</p>
            </div>
        </div>

        <a href="{{ url_for('main.home') }}" class="btn-logout">
            ← Voltar
        </a>
    </header>

    <section class="card edit-card">

        <div class="card-header">
            <span class="section-icon">✎</span>
            <div>
                <h2>Editar informações</h2>
                <p>Faça as alterações necessárias no seu livro.</p>
            </div>
        </div>

        <form method="POST"
              action="{{ url_for('main.editar_livro', id_livro=livro.id) }}"
              class="book-form">

            <div class="form-group">
                <label for="titulo">Título do livro</label>
                <input
                    type="text"
                    id="titulo"
                    name="titulo"
                    value="{{ livro.titulo }}"
                    maxlength="150"
                    required>
            </div>

            <div class="form-group">
                <label for="autor">Autor</label>
                <input
                    type="text"
                    id="autor"
                    name="autor"
                    value="{{ livro.autor }}"
                    maxlength="100"
                    required>
            </div>

            <button type="submit" class="btn-submit">
                Salvar alterações
            </button>

            <a href="{{ url_for('main.home') }}"
               class="btn-cancel">
                Cancelar
            </a>

        </form>

    </section>

</div>

{% endblock %}
