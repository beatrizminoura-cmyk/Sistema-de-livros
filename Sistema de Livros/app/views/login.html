<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <div class="container">

        <h1>Login</h1>

        <form method="POST">

            <div class="form-group">
                <label for="usuario">Usuário:</label>

                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    required
                >
            </div>

            <div class="form-group">
                <label for="senha">Senha:</label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    required
                >
            </div>

            <button type="submit">
                Entrar
            </button>

        </form>

        {% if erro %}
            <p class="erro">{{ erro }}</p>
        {% endif %}

    </div>

</body>

</html>
