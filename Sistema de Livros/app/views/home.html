<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Meus Livros</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <div class="container">

        <h1>
            Olá, {{ session["usuario_nome"] }}!
        </h1>

        <h2>Meus livros</h2>

        {% if livros %}

            <ul>

                {% for livro in livros %}

                    <li>
                        <strong>
                            {{ livro.titulo }}
                        </strong>

                        <span>
                            — {{ livro.autor }}
                        </span>
                    </li>

                {% endfor %}

            </ul>

        {% else %}

            <p>
                Nenhum livro cadastrado.
            </p>

        {% endif %}

        <a href="{{ url_for('auth.logout') }}">
            Sair
        </a>

    </div>

</body>

</html>
